---
- name: Configure xfce
  hosts: localhost
  gather_facts: true

  tasks:
    - name: Create the default Desktop Settings
      builtin.copy:
        dest: "/etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xfce4-desktop.xml"
        content: |
        <?xml version="1.0" encoding="UTF-8"?>
        <channel name="xfce4-desktop" version="1.0">
          <property name="backdrop" type="empty">
            <property name="screen0" type="empty">
              <property name="monitorrdp0" type="empty">
                <property name="workspace0" type="empty">
                  <property name="color-style" type="int" value="0"/>
                  <property name="image-style" type="int" value="5"/>
                  <property name="last-image" type="string" value="/usr/share/backgrounds/xfce/xfce-stripes.png"/>
                </property>
              </property>
            </property>
          </property>
        </channel>

