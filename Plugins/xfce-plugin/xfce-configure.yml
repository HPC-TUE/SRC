---
- name: Configure xfce
  hosts: localhost
  gather_facts: true

  tasks:
    - name: Copy the Desktop Background to correct location
      copy:
        src: files/SCC-OpenFOAM-workshop.png
        dest: /usr/share/backgrounds/xfce/SCC-OpenFOAM-workshop.png
        mode: 0644
    - name: Copy the Desktop icons
      copy:
        src: files/{{item}}.png
        dest: /usr/share/pixmaps/{{item}}.png
        mode: 0644
      with-items: ['paraviewicon','openfoamicon']
    - name: Create the default Desktop Settings
      copy:
        src: files/xfce4-desktop.xml
        dest: /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xfce4-desktop.xml
        mode: 0644
    - name: Add EESSI init in bash.bashrc
      lineinfile:
        line: source /cvmfs/software.eessi.io/versions/2023.06/init/bash
        path: /etc/bash.bashrc
        
        
