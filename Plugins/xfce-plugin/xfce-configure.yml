---
- name: Configure xfce
  hosts: localhost
  gather_facts: true

  tasks:
    - name: Copy the Desktop Background to correct location
      copy:
        src: files/SCC-OpenFOAM-workshop.png
        dest: /usr/share/backgrounds/xfce/SCC-OpenFOAM-workshop.png
        mode: 0644
    - name: Create the default Desktop Settings
      copy:
        src: files/xfce4-desktop.xml
        dest: /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xfce4-desktop.xml
        mode: 0644
    - name: Add EESSI init in profile.d
      copy:
        src: files/EESSI-init.sh
        dest: /etc/profile.d/EESSI-init.sh
        mode: 0644
        
