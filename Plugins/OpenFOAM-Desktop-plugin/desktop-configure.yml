---
- name: Configure OpenFOAM Desktop Environment
  hosts: localhost
  gather_facts: true

  tasks:
    - name: Copy the Desktop Background to the correct location
      ansible.builtin.copy:
        src: files/SCC-OpenFOAM-workshop.png
        dest: /usr/share/backgrounds/xfce/SCC-OpenFOAM-workshop.png
        mode: '0644'
    - name: Copy the Desktop icons
      ansible.builtin.copy:
        src: files/{{ item }}.png
        dest: /usr/share/pixmaps/{{ item }}.png
        mode: '0644'
      with_items: ['paraviewicon', 'openfoamicon']
    - name: Copy the Desktop launchers
      ansible.builtin.copy:
        src: files/{{ item }}.desktop
        dest: /usr/share/applications/{{ item }}.desktop
        mode: '0755'
      with_items: ['paraview', 'openfoam']
    - name: Copy the Autostart Desktop Launchers-copy
      ansible.builtin.copy:
        src: files/copyapps.desktop
        dest: /etc/xdg/autostart/zz_copyapps.desktop
        mode: '0644'
    - name: Create the default Desktop Settings
      ansible.builtin.copy:
        src: files/xfce4-desktop.xml
        dest: /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xfce4-desktop.xml
        mode: '0644'
    - name: Docker | repo install
      block:
        - name: Docker | apt key
          ansible.builtin.get_url:
            url: https://download.docker.com/linux/ubuntu/gpg
            dest: /etc/apt/keyrings/docker.asc
            mode: '0644'
        - name: Docker | apt source
          ansible.builtin.apt_repository:
            repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
            state: present
    - name: Openfoam | repo install
      block:
        - name: Openfoam | get repo install script
          ansible.builtin.get_url:
            url: https://dl.openfoam.com/add-debian-repo.sh
            dest: /tmp/add-debian-repo.sh
            mode: '0755'
        - name: Openfoam | run repo install script
          ansible.builtin.command:
            cmd: /tmp/add-debian-repo.sh
            creates: /etc/apt/sources.list.d/openfoam.list

    - name: Apptainer | repo install
      ansible.builtin.apt_repository:
        repo: "ppa:apptainer/ppa"
        state: present

    - name: Update apt
      ansible.builtin.apt:
        update_cache: true

    - name: Docker | install packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
    - name: Docker | ensure docker service is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
    - name: Docker | get active users from shell and register output
      ansible.builtin.command: "awk -F: -v ORS=\" \" '$3 > 1000 && $1 != \"nobody\" { print $1 }' /etc/passwd"
      register: active_users
    - name: Docker | set active users fact from command output
      ansible.builtin.set_fact:
        active_users: "{{ active_users.stdout.split() }}"
    - name: Docker | add active user to docker group
      ansible.builtin.user:
        name: "{{ item }}"
        groups: docker
        append: true
      loop: "{{ active_users }}"

    - name: Openfoam | install with dependencies
      ansible.builtin.apt:
        name:
          - build-essential
          - flex
          - bison
          - cmake
          - zlib1g-dev
          - libboost-system-dev
          - libboost-thread-dev
          - libopenmpi-dev
          - openmpi-bin
          - gnuplot
          - libreadline-dev
          - libncurses-dev
          - libxt-dev
          - libscotch-dev
          - libcgal-dev
          - openfoam2406-default
        state: present

    - name: Apptainer | install apptainer
      ansible.builtin.apt:
        name: apptainer
        state: present
